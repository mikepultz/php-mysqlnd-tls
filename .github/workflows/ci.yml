name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # The full suite, in the test rig (tests/rig): the extension is built
  # inside each image, with warnings as errors, and run against two
  # MySQL 8.4 servers, one with TLS and one without. The rig fails on a
  # skipped test, so every test runs.
  #
  # php:*   the official PHP images (Debian, mysqlnd compiled in); the
  #         zts images cover the thread-safe build
  # remi:*  AlmaLinux 9 with Remi's PHP, where mysqlnd is a shared module
  # ------------------------------------------------------------------
  tests:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'php:7.4-cli'
          - 'php:8.0-cli'
          - 'php:8.1-cli'
          - 'php:8.2-cli'
          - 'php:8.3-cli'
          - 'php:8.4-cli'
          - 'php:8.5-cli'
          - 'php:8.6-rc-cli'
          - 'php:7.4-zts'
          - 'php:8.5-zts'
          - 'remi:7.4'
          - 'remi:8.3'
          - 'remi:8.4'
          - 'remi:8.5'
    steps:
      - uses: actions/checkout@v5

      - name: Build and test
        run: tests/rig/rig.sh run '${{ matrix.image }}'

  # ------------------------------------------------------------------
  # Static analysis: cppcheck and GCC's -fanalyzer, both as hard gates
  # (-Werror).
  # ------------------------------------------------------------------
  static-analysis:
    name: static analysis (cppcheck + gcc -fanalyzer)
    runs-on: ubuntu-latest
    container: php:8.5-cli
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cppcheck

      # findings inside PHP's own headers are not ours to fix, and the two
      # information notes would otherwise fail the run
      - name: cppcheck
        run: |
          cppcheck --std=c11 --quiet --error-exitcode=1 --inline-suppr \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem --suppress=missingInclude \
            --suppress=preprocessorErrorDirective \
            --suppress=normalCheckLevelMaxBranches --suppress=toomanyconfigs \
            --suppress="*:$(php-config --include-dir)/*" \
            $(php-config --includes) -I src -I . src/*.c

      - name: gcc -fanalyzer (warnings as errors)
        run: |
          phpize
          ./configure
          make CFLAGS='-fanalyzer -g -O2 -Wall -Wextra -Wno-unused-parameter -Werror'
